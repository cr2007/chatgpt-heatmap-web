<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: light)"
      content="#f8fafe"
    />
    <meta
      name="theme-color"
      media="(prefers-color-scheme: dark)"
      content="#08090c"
    />
    <title>AI Chat Heatmap</title>
    <meta
      name="description"
      content="Visualise your ChatGPT and Claude conversation history as an interactive calendar heatmap"
    />
    <meta name="application-name" content="AI Chat Heatmap" />
    <meta name="robots" content="index, follow" />
    <meta
      name="keywords"
      content="ChatGPT, Claude, AI, heatmap, calendar heatmap, conversation history, chat analytics, message activity, data visualisation, AI chat"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aiheatmap.csk.fyi" />
    <meta property="og:site_name" content="AI Chat Heatmap" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="AI Chat Heatmap" />
    <meta
      property="og:description"
      content="Visualise your ChatGPT and Claude conversation history as an interactive calendar heatmap"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AI Chat Heatmap" />
    <meta
      name="twitter:description"
      content="Visualise your ChatGPT and Claude conversation history as an interactive calendar heatmap"
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "AI Chat Heatmap",
        "description": "Visualise your ChatGPT and Claude conversation history as an interactive calendar heatmap",
        "url": "https://aiheatmap.csk.fyi",
        "applicationCategory": "UtilityApplication",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>
    <link rel="icon" href="./app/assets/favicon.ico" />
    <!-- Archivo (Omnibus-Type, OFL, see public/fonts/OFL.txt): variable 100-900, Latin subset.
         Inline so the bundler leaves the URL alone: it would put a font under 128 kB
         into the CSS as base64 (oven-sh/bun#24599). -->
    <style>
      @font-face {
        font-family: "Archivo";
        src: url("/fonts/Archivo.woff2") format("woff2");
        font-weight: 100 900;
        font-display: swap;
      }
    </style>
    <noscript>
      <style>
        #root {
          display: none;
        }
        .noscript-fallback {
          display: block !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div
      class="noscript-fallback"
      style="
        display: none;
        padding: 2rem;
        max-width: 480px;
        margin: 4rem auto;
        text-align: center;
        font-family: system-ui, sans-serif;
        line-height: 1.6;
      "
    >
      <h1 style="font-size: 1.25rem; font-weight: 600; margin-bottom: 0.75rem">
        AI Chat Heatmap
      </h1>
      <p style="color: #555; margin-bottom: 1rem">
        Visualise your ChatGPT and Claude conversation history as an interactive
        calendar heatmap.
      </p>
      <p style="color: #888; font-size: 0.875rem">
        JavaScript is required to run this app. Please enable it in your browser
        settings and reload the page.
      </p>
    </div>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
