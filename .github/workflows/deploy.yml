# A release: a pushed version tag (vX.Y.Z, made by `bun pm version X.Y.Z`)
# runs the full check once, and checks that the tag matches package.json and
# is on main. Only when both pass, it publishes the Docker image to ghcr.io
# and, for the newest release, deploys dist/ to GitHub Pages, in parallel.
# Pushes to a branch deploy nothing.
#
# Actions are pinned to a commit (the tag can move); Dependabot updates them.

name: Deploy

on:
  push:
    tags: ["v*.*.*"]

# Each job gets only the rights it needs (the Pages rights: the deploy job only).
permissions:
  contents: read

jobs:
  check:
    # actionlint 1.7.12 rejects the $/ form; switch when it accepts it.
    uses: ./.github/workflows/check.yml # zizmor: ignore[self-repository]

  # The tag must be the version in package.json and a commit on main, so a
  # release cannot ship a different version or code that main does not have.
  version:
    runs-on: ubuntu-latest
    outputs:
      newest: ${{ steps.newest.outputs.newest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # all tags and main, for the two checks below
      - name: Tag matches package.json and is on main
        run: |
          want="v$(jq -r .version package.json)"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($want)."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME is on a commit that is not on main."
            exit 1
          fi
      # Only the newest release (not a pre-release, not a fix to an older
      # version) moves "latest" and the Pages site.
      - name: Is this the newest release
        id: newest
        run: |
          top="$(git tag -l 'v*.*.*' --sort=-v:refname | grep -v -- - | head -1)"
          echo "newest=$([ "$top" = "$GITHUB_REF_NAME" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  build:
    needs: [check, version]
    if: needs.version.outputs.newest == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun # version from package.json "packageManager"
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true # a release does not restore a Bun binary that a cache could poison

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun --bun run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # One Pages deploy at a time. A group on this job only, so a waiting
    # release never cancels the check or the image of another one.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Docker image on ghcr.io: runs in parallel with the Pages build, after the same checks.
  docker:
    needs: [check, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      IMAGE: ghcr.io/${{ github.repository }}

    steps:
      - name: Normalize image name
        run: echo "IMAGE=${IMAGE,,}" >> "$GITHUB_ENV"
      - name: Login to GitHub Container Registry
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # v1.2.3 gives 1.2.3 and 1.2, plus latest when it is the newest release.
      # A pre-release (v1.3.0-rc.1) gives only its own tag.
      - name: Image tags and labels from the version
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ needs.version.outputs.newest }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
