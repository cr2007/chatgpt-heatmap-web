# Tests, lint, types, format, audit and the size budget. Pull requests run
# it directly; deploy.yml calls it for a release (a vX.Y.Z tag) and deploys
# only when it passes.
name: Check

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # bun test runs in UTC unless TZ is set, which hides time zone bugs.
        tz: [UTC, America/New_York, Asia/Kolkata]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0, Bun from package.json "packageManager"
      - run: bun install --frozen-lockfile
      - run: bun --bun test
        env:
          TZ: ${{ matrix.tz }}

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0, Bun from package.json "packageManager"
      - run: bun install --frozen-lockfile
      - name: Lint
        run: bun run lint
      - name: Type check
        run: bun check
      - name: Format
        run: bun fmt --check
      - name: Audit runtime dependencies
        run: bun audit --prod
      - name: Build
        run: bun --bun run build
      - name: Size budget
        run: bun run size
