name: Handle Issue Claims

on:
  issue_comment: # zizmor: ignore[dangerous-triggers] the action reads the comment as data (through env) and never checks out or runs PR code
    types: [created]

permissions:
  contents: read

jobs:
  handle-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      # .take, .release, .assign @user and .unassign @user, for collaborators
      # only; comments on pull requests are ignored.
      - name: Process issue commands
        uses: cr2007/actions/issue-assignment@f70ddd9add55a336ddf19f40bd4d695535d5c6df # v1.1.0
        with:
          comment-body: ${{ github.event.comment.body }}
          comment-author: ${{ github.event.comment.user.login }}
          issue-number: ${{ github.event.issue.number }}
          repository: ${{ github.repository }}
          is-pull-request: ${{ github.event.issue.pull_request != null }}
